name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: swift test (core logic)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Swift version
        run: swift --version
      - name: Run unit tests
        run: swift test
